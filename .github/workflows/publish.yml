name: Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  # Pushing images to ghcr.io/cratis. The workflow's own GITHUB_TOKEN is the publishing credential,
  # so there is no registry secret to hold or rotate.
  packages: write

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Corepack enable
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      # The SPA build has to land in Source/Ante/wwwroot before the backend publish below, since
      # dotnet publish picks up wwwroot as static web assets and bundles them into the output.
      - name: Build frontend
        working-directory: Source/Ante
        env:
          ANTE_PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: yarn build

      # Portable (RID-less) publish - no architecture-specific binaries, nothing compiled inside
      # Docker. CratisProxiesOutputPath is cleared so the proxy generator's MSBuild target no-ops
      # for this Release publish instead of re-running against a second compilation of
      # already-correct generated files (they were verified fresh by build.yml before this merged).
      - name: Publish backend
        run: >
          dotnet publish Source/Ante/Ante.csproj
          --configuration Release
          --self-contained false
          -p:UseAppHost=false
          -p:CratisProxiesOutputPath=
          -o Source/Ante/out

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is Source/Ante (not the repo root) to match the Dockerfile's `COPY out ./` -
      # see the comment in Source/Ante/Dockerfile. Versioning is kept simple and honest: this repo
      # has no release-action scaffolding yet (no label-driven semver, no GitHub release), so the
      # image tag is just 0.1.<run number> - monotonically increasing, but not yet a real semantic
      # version. Revisit once Ante adopts the same release-action pattern as Cratis/Stagehand.
      - name: Build and push
        env:
          VERSION: 0.1.${{ github.run_number }}
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --push \
            --file Source/Ante/Dockerfile \
            --tag ghcr.io/cratis/ante:"$VERSION" \
            --tag ghcr.io/cratis/ante:latest \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.revision="$REVISION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.created="$CREATED" \
            Source/Ante

  # Cratis.Ante.Contracts via NuGet.org trusted publishing (OIDC) - no long-lived API key secret
  # to hold or rotate. The trusted-publishing policy on nuget.org is bound to this workflow file
  # (publish.yml) by name, so the job must live here rather than in a separately named workflow.
  # Same 0.1.<run number> scheme as the image tag above for coherence; see that job's comment on
  # why this repo isn't yet on the label-driven cratis/release-action semver pipeline.
  publish-nuget:
    name: Pack and push Cratis.Ante.Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for NuGet trusted publishing using OIDC tokens.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack Ante.Contracts
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: dotnet pack Source/Ante.Contracts -c Release /p:Version=$VERSION -o ${{ runner.temp }}/nuget

      # Get a short-lived NuGet API key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet package
        run: dotnet nuget push --skip-duplicate '${{ runner.temp }}/nuget/*.nupkg' --timeout 900 --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
