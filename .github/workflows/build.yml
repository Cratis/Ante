name: Build

# Pull requests supersede their own earlier runs. A push to main is never cancelled or replaced by a
# later merge: Publish gates each release on the Build run of that exact commit, so a Build cancelled
# by the next merge would silently cost the earlier merge its release. Keying push runs on the commit
# gives every merge its own group (a group with cancel-in-progress false keeps only one pending run,
# and would cancel the older pending one).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node (proxy generation runs during the Debug build)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Debug regenerates the TypeScript proxies and compiles the #if DEBUG spec code. Release is a
      # build-only check; CratisProxiesOutputPath is cleared so the proxy generator's MSBuild target
      # no-ops instead of re-running against a second compilation of already-correct generated files.
      - name: Build (Debug)
        if: matrix.configuration == 'Debug'
        run: dotnet build Ante.slnx --configuration Debug

      - name: Build (Release)
        if: matrix.configuration == 'Release'
        run: dotnet build Ante.slnx --configuration Release -p:CratisProxiesOutputPath=

      - name: Test
        if: matrix.configuration == 'Debug'
        run: dotnet test Ante.slnx --configuration Debug --no-build --logger "console;verbosity=minimal"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Debug backend build regenerates the TypeScript proxies; the frontend gate needs them
      # present on disk (they are committed, but a PR that changes backend contracts without
      # rebuilding would otherwise pass a stale proxy through lint/tsc).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Regenerate proxies (Debug build, no test execution needed here)
        run: dotnet build Ante.slnx --configuration Debug

      - name: Corepack enable
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      - name: Lint
        working-directory: Source/Ante
        run: yarn lint:ci

      - name: TypeScript compile
        working-directory: Source/Ante
        run: yarn compile

      - name: Test
        working-directory: Source/Ante
        run: yarn test

      # PRIMEUI_LICENSE is an Actions secret, which pull requests from forks (and Dependabot, whose
      # secrets are a separate store) never receive. Lint, compile and test above still gate those
      # pull requests; only the production bundle is skipped, with a visible notice. On pushes and in
      # same-repository pull requests the secret is present and the build always runs, so a
      # missing or renamed secret there fails the build instead of being skipped silently.
      - name: Build
        working-directory: Source/Ante
        env:
          ANTE_PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$ANTE_PRIMEUI_LICENSE" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::notice title=Frontend build skipped::PRIMEUI_LICENSE is not available to this pull request (fork or Dependabot). Lint, compile and test still ran; the production build runs on main."
            echo "Frontend production build skipped: PRIMEUI_LICENSE is not available to this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          yarn build
